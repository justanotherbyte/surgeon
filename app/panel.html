<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src file: data:; style-src 'self' 'unsafe-inline' file:">
<title>Surgeon</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/surgeon.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Room for the panel shadow inside the transparent window. */
  #root { padding: 4px 20px 24px; width: fit-content; }
  .plan-sub { display: block; font-size: var(--text-small); font-weight: 450; color: var(--ink-3); }
  .route { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  /* Long document names must not squeeze the text field. */
  .target { max-width: 220px; }
  .target .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Sub-app consent and output. */
  .consent-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-4); padding: 0 var(--s-6) var(--s-5); font-size: var(--text-small); color: var(--ink-2); }
  .consent-body p { margin: 0; text-wrap: pretty; }
  .consent-body strong { color: var(--ink); font-weight: 600; }
  .consent-routes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-2); }
  .consent-routes li { display: flex; gap: var(--s-3); align-items: baseline; }
  .consent-routes .tag { flex: none; }
  .consent-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-2); }
  .consent-steps li { display: flex; gap: var(--s-3); align-items: center; justify-content: space-between; min-height: 22px; }
  .consent-steps .button-name { color: var(--ink); font-weight: 600; margin-top: var(--s-2); }
  .script-name { font: 500 var(--text-caption) / 1.4 var(--font-code); color: var(--ink-3); }
  .script, .sub-text {
    margin: var(--s-2) 0 0; max-height: 200px; overflow: auto; padding: var(--s-4) var(--s-5);
    background: var(--hud-sunken); border: 0.5px solid var(--hud-line); border-radius: var(--r-row);
    font: 450 var(--text-caption) / 1.5 var(--font-code); color: var(--ink); white-space: pre; tab-size: 4;
  }
  .notice-cmd { padding: 0 var(--s-6) var(--s-5); }
  .notice-cmd .script { white-space: pre-wrap; word-break: break-all; user-select: all; }
  .sub-text { margin: 0 var(--s-6) var(--s-5); white-space: pre-wrap; }
  .sub-rows { padding: 0 var(--s-4) var(--s-4); max-height: 320px; overflow: auto; }
  .sub-rows .row { min-height: 26px; font: 450 var(--text-small) / 1.3 var(--font-code); }
  .toast { margin-top: 0; }
</style>
</head>
<body class="sg">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-saved" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="pip-shape" viewBox="0 0 18 18">
    <circle class="pip-ring" cx="9" cy="9" r="10.5"/>
    <path class="pip-body" d="M2.6 2.4c-.3-.2-.6.1-.4.4l5.1 12.6c.2.5.9.5 1.1 0l1.7-4.8 4.8-1.7c.5-.2.5-.9 0-1.1z"/>
    <path class="pip-glyph done" d="M5.4 7.6 7 9.1l2.6-2.8"/>
    <path class="pip-glyph error" d="M7.4 5.2v2.4M7.4 9.7v.01"/>
  </symbol>
</svg>

<div id="root">
  <!-- Command bar -->
  <div class="hud bar" id="bar" data-enter>
    <div class="bar-row">
      <span class="target" id="target"><img class="app-icon" id="target-icon" alt="" hidden><span id="target-app"></span> <span class="sub" id="target-doc"></span></span>
      <textarea class="bar-input sg-input-focus" id="input" rows="1" aria-label="Command" autocomplete="off" spellcheck="false"></textarea>
      <span class="bar-status" id="status" hidden><span class="pip" data-state="think"><svg><use href="#pip-shape"/></svg></span><span id="status-text">Planning</span></span>
      <span class="kbd" id="enter-hint"><kbd>Enter</kbd></span>
    </div>
    <div class="hud-section" id="saved" hidden>
      <div class="list-head" id="saved-head">Saved</div>
      <ul class="list" role="listbox" aria-label="Saved commands" id="saved-list"></ul>
    </div>
  </div>

  <!-- Plan -->
  <div class="hud plan" id="plan" hidden data-enter>
    <div class="plan-head">
      <img class="app-icon" id="plan-icon" alt="" hidden>
      <span class="plan-ask"><span id="plan-ask"></span><span class="plan-sub" id="plan-summary"></span></span>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="plan-foot">
      <span class="hint" id="plan-hint"></span>
      <button class="btn btn-plain" type="button" id="save" hidden>Save as shortcut</button>
      <button class="btn btn-primary" type="button" id="run">Run <span class="kbd" id="run-keys"><kbd>Enter</kbd></span></button>
    </div>
  </div>

  <!-- Sub-app consent, and managing an installed one -->
  <div class="hud plan" id="consent" hidden data-enter>
    <div class="plan-head">
      <img class="app-icon" id="consent-icon" alt="" hidden>
      <span class="plan-ask"><span id="consent-title"></span><span class="plan-sub" id="consent-sub"></span></span>
      <span class="route" data-route="helper">helper</span>
    </div>
    <div class="consent-body">
      <p id="consent-gap"></p>
      <ul class="consent-routes" id="consent-routes"></ul>
      <p><strong>Runs</strong> <span id="consent-trigger"></span></p>
      <ul class="consent-steps" id="consent-steps" aria-label="Steps"></ul>
      <p><strong>Reads</strong> <span id="consent-reads"></span></p>
      <div id="consent-scripts"></div>
    </div>
    <div class="plan-foot">
      <span class="hint" id="consent-hint">Scripts run sandboxed: no network, no sockets, no writes, no signals</span>
      <button class="btn btn-plain" type="button" id="consent-remove" hidden>Remove</button>
      <button class="btn btn-plain" type="button" id="consent-toggle" hidden>Turn off</button>
      <button class="btn btn-primary" type="button" id="consent-install">Install <span class="kbd"><kbd>Ctrl</kbd><kbd>Enter</kbd></span></button>
    </div>
  </div>

  <!-- A sub-app's output beside its app -->
  <div class="hud plan" id="subpanel" hidden data-enter>
    <div class="plan-head">
      <span class="plan-ask"><span id="sub-title"></span><span class="plan-sub" id="sub-name"></span></span>
      <span class="route" data-route="helper">helper</span>
    </div>
    <ul class="list sub-rows" id="sub-rows" aria-label="Sub-app output"></ul>
    <pre class="sub-text" id="sub-text" hidden></pre>
    <div class="plan-foot">
      <span class="hint">From a sandboxed script. Nothing went to Codex</span>
      <button class="btn" type="button" id="sub-close">Close <span class="kbd"><kbd>Esc</kbd></span></button>
    </div>
  </div>

  <!-- Notice -->
  <div class="hud notice" id="notice" hidden data-enter data-tone="info">
    <div class="notice-body">
      <span class="notice-mark"><svg class="icon"><use id="notice-icon" href="#i-alert"/></svg></span>
      <span class="notice-title" id="notice-title"></span>
      <span class="notice-text" id="notice-text"></span>
    </div>
    <div class="notice-cmd" id="notice-cmd" hidden><pre class="script" id="notice-command"></pre></div>
    <div class="notice-foot">
      <button class="btn" type="button" id="notice-copy" hidden>Copy command</button>
      <button class="btn" type="button" id="notice-ok"><span id="notice-ok-label">OK</span> <span class="kbd"><kbd>Esc</kbd></span></button>
      <button class="btn btn-primary" type="button" id="notice-action" hidden><span id="notice-action-label"></span> <span class="kbd"><kbd>Enter</kbd></span></button>
    </div>
  </div>

  <!-- Toast -->
  <div class="hud toast" id="toast" hidden data-enter role="status">
    <svg class="icon ok"><use href="#i-check"/></svg>
    <span id="toast-text"></span>
    <span class="sep" id="toast-sep"></span>
    <span class="kbd" id="toast-keys"></span>
  </div>
</div>
<script type="module" src="dist/panel.js"></script>
</body>
</html>
