<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src file: data:; style-src 'self' 'unsafe-inline' file:">
<title>Surgeon</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/surgeon.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Room for the panel shadow inside the transparent window. */
  #root { padding: 4px 20px 24px; width: fit-content; }
  .plan-sub { display: block; font-size: var(--text-small); font-weight: 450; color: var(--ink-3); }
  .route { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  /* Long document names must not squeeze the text field. */
  .target { max-width: 220px; }
  .target .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .toast { margin-top: 0; }
</style>
</head>
<body class="sg">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-saved" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="pip-shape" viewBox="0 0 18 18">
    <circle class="pip-ring" cx="9" cy="9" r="10.5"/>
    <path class="pip-body" d="M2.6 2.4c-.3-.2-.6.1-.4.4l5.1 12.6c.2.5.9.5 1.1 0l1.7-4.8 4.8-1.7c.5-.2.5-.9 0-1.1z"/>
    <path class="pip-glyph done" d="M5.4 7.6 7 9.1l2.6-2.8"/>
    <path class="pip-glyph error" d="M7.4 5.2v2.4M7.4 9.7v.01"/>
  </symbol>
</svg>

<div id="root">
  <!-- Command bar -->
  <div class="hud bar" id="bar" data-enter>
    <div class="bar-row">
      <span class="target" id="target"><img class="app-icon" id="target-icon" alt="" hidden><span id="target-app"></span> <span class="sub" id="target-doc"></span></span>
      <input class="bar-input sg-input-focus" id="input" aria-label="Command" autocomplete="off" spellcheck="false">
      <span class="bar-status" id="status" hidden><span class="pip" data-state="think"><svg><use href="#pip-shape"/></svg></span><span id="status-text">Planning</span></span>
      <span class="kbd" id="enter-hint"><kbd>Enter</kbd></span>
    </div>
    <div class="hud-section" id="saved" hidden>
      <div class="list-head" id="saved-head">Saved</div>
      <ul class="list" role="listbox" aria-label="Saved commands" id="saved-list"></ul>
    </div>
  </div>

  <!-- Plan -->
  <div class="hud plan" id="plan" hidden data-enter>
    <div class="plan-head">
      <img class="app-icon" id="plan-icon" alt="" hidden>
      <span class="plan-ask"><span id="plan-ask"></span><span class="plan-sub" id="plan-summary"></span></span>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="plan-foot">
      <span class="hint" id="plan-hint"></span>
      <button class="btn btn-plain" type="button" id="save" hidden>Save as shortcut</button>
      <button class="btn btn-primary" type="button" id="run">Run <span class="kbd" id="run-keys"><kbd>Enter</kbd></span></button>
    </div>
  </div>

  <!-- Notice -->
  <div class="hud notice" id="notice" hidden data-enter data-tone="info">
    <div class="notice-body">
      <span class="notice-mark"><svg class="icon"><use id="notice-icon" href="#i-alert"/></svg></span>
      <span class="notice-title" id="notice-title"></span>
      <span class="notice-text" id="notice-text"></span>
    </div>
    <div class="notice-foot"><button class="btn" type="button" id="notice-ok">OK <span class="kbd"><kbd>Esc</kbd></span></button></div>
  </div>

  <!-- Toast -->
  <div class="hud toast" id="toast" hidden data-enter role="status">
    <svg class="icon ok"><use href="#i-check"/></svg>
    <span id="toast-text"></span>
    <span class="sep" id="toast-sep"></span>
    <span class="kbd" id="toast-keys"></span>
  </div>
</div>
<script type="module" src="dist/panel.js"></script>
</body>
</html>
