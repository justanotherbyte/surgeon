<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'self' 'unsafe-inline' file:">
<title>Surgeon toolbar</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/surgeon.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Room for the shadow inside the transparent window. */
  #root { display: grid; gap: var(--s-3); padding: 4px 12px 16px; width: max-content; }
  .toolbar { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--r-row); }
  .toolbar .route { max-width: 140px; overflow: hidden; text-overflow: ellipsis; margin-right: var(--s-2); }
  .toolbar .btn { height: 26px; padding: 0 var(--s-4); }
</style>
</head>
<body class="sg">
<div id="root" role="toolbar" aria-label="Surgeon toolbars"></div>
<script type="module" src="dist/toolbar.js"></script>
</body>
</html>
